<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Amme-app tests</title>
<style>
  body { font: 14px/1.4 ui-monospace, Menlo, monospace; margin: 16px; background: #fff; color: #111; }
  iframe { width: 390px; height: 700px; border: 1px solid #ccc; float: right; margin-left: 16px; }
  .pass { color: #187a2f; } .fail { color: #b00020; font-weight: bold; }
  pre { white-space: pre-wrap; }
</style>

<body>
<div id="frameBox"></div>
<h1 id="summary">Kører…</h1>
<pre id="out"></pre>
<script>
'use strict';
// Tests af amme-appen. Appen indlæses i en 390px iframe (iPhone-bredde), og testene
// kalder appens egne funktioner og klikker på knapperne.
//
// Kør: bash tests/run.sh  (eller åbn http://localhost:PORT/tests/ i en browser)
//
// Testene skriver i localStorage på samme origin som appen. Derfor kører de kun på
// localhost, og eksisterende data gemmes først og lægges tilbage bagefter.

const LOCAL = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
const KEYS = ['amme-v1', 'amme-tab', 'amme-hint-closed'];
const M = 60000, H = 60 * M;

// ---------- Mini-testramme ----------
const tests = [];
const test = (name, fn) => tests.push({ name, fn });
const fmt = (v) => JSON.stringify(v);
function eq(actual, expected, what = '') {
  if (fmt(actual) !== fmt(expected)) throw new Error(`${what ? what + ': ' : ''}fik ${fmt(actual)}, forventet ${fmt(expected)}`);
}
function ok(cond, what) { if (!cond) throw new Error(what); }
const tick = (ms = 0) => new Promise((r) => setTimeout(r, ms));

// Starter appen forfra med de givne data. seed = undefined betyder tom localStorage.
async function boot(seed, { tab, raw } = {}) {
  for (const k of KEYS) localStorage.removeItem(k);
  if (raw !== undefined) localStorage.setItem('amme-v1', raw);
  else if (seed !== undefined) localStorage.setItem('amme-v1', JSON.stringify({ name: 'Test', lastSide: null, active: null, sessions: [], ...seed }));
  if (tab) localStorage.setItem('amme-tab', tab);
  const box = document.getElementById('frameBox');
  box.innerHTML = '';
  const f = document.createElement('iframe');
  f.src = '../index.html';
  const loaded = new Promise((r) => (f.onload = r));
  box.appendChild(f);
  await loaded;
  const w = f.contentWindow;
  const alerts = [];
  let confirmAnswer = true;
  w.alert = (m) => alerts.push(m);
  w.confirm = (m) => { alerts.push(m); return confirmAnswer; };
  const realNow = w.Date.now.bind(w.Date);
  const app = {
    w, alerts,
    $: (id) => w.document.getElementById(id),
    q: (sel) => w.document.querySelector(sel),
    text: (id) => w.document.getElementById(id).textContent,
    state: () => w.eval('state'),
    stored: () => JSON.parse(localStorage.getItem('amme-v1')),
    setNow: (t) => { w.Date.now = () => t; },
    realNow,
    confirmAnswer: (v) => { confirmAnswer = v; },
    live: () => w.renderLive(),
    // Indsender en dialogs formular med dens "save"-knap, ligesom et tryk på Gem
    submit: (dlgId) => {
      const form = w.document.querySelector(`#${dlgId} form`);
      form.requestSubmit(form.querySelector('button[value="save"]'));
    },
    // Lægger en fil i backup-importen og venter på, at den er læst
    importJSON: async (obj) => {
      const input = w.document.getElementById('importFile');
      const dt = new w.DataTransfer();
      dt.items.add(new w.File([typeof obj === 'string' ? obj : JSON.stringify(obj)], 'backup.json', { type: 'application/json' }));
      input.files = dt.files;
      input.dispatchEvent(new w.Event('change'));
      for (let i = 0; i < 50 && !alerts.some((a) => /importeret|kunne ikke/i.test(a)); i++) await tick(10);
    },
  };
  return app;
}

const NOW = Date.now();
const sess = (id, startAgo, endAgo, L = 300, R = 300) =>
  ({ id, start: NOW - startAgo, ...(endAgo == null ? {} : { end: NOW - endAgo }), L, R });

// ---------- Lagring og migrering ----------
test('Tom localStorage giver en tom app med alle lister', async () => {
  const a = await boot();
  const s = a.state();
  eq(s.sessions, []); eq(s.diapers, []); eq(s.sleeps, []); eq(s.sleepActive, null); eq(s.active, null);
});

test('Gammelt format (kun amninger) migreres uden datatab', async () => {
  const old = { name: 'Frida', lastSide: 'R', active: null, sessions: [sess('a', 2 * H, H)] };
  const a = await boot(undefined, { raw: JSON.stringify(old) });
  const s = a.state();
  eq(s.sessions, old.sessions, 'amninger');
  eq(s.name, 'Frida'); eq(s.lastSide, 'R');
  eq(s.diapers, []); eq(s.sleeps, []); eq(s.sleepActive, null);
});

test('Ødelagt JSON i localStorage giver en tom app i stedet for at gå ned', async () => {
  const a = await boot(undefined, { raw: '{ikke json' });
  eq(a.state().sessions, []);
});

test('Barnets navn vises i headeren', async () => {
  const a = await boot({ name: 'Frida' });
  ok(a.w.document.body.textContent.includes('Frida'), 'navnet blev ikke fundet på siden');
});

// ---------- Amning: timer ----------
test('Start venstre starter timeren, og knappen hedder "Stop venstre"', async () => {
  const a = await boot({});
  a.setNow(NOW);
  a.$('btnL').click();
  const act = a.state().active;
  eq(act.running, 'L'); eq(act.start, NOW);
  eq(a.text('btnL'), 'Stop venstre'); eq(a.text('btnR'), 'Start højre');
  eq(a.stored().active.running, 'L', 'gemt i localStorage');
});

test('Skift til højre sætter venstre på pause og gemmer dens tid', async () => {
  const a = await boot({});
  a.setNow(NOW); a.$('btnL').click();
  a.setNow(NOW + 5 * M); a.$('btnR').click();
  const act = a.state().active;
  eq(act.running, 'R'); eq(act.acc.L, 5 * M); eq(act.since, NOW + 5 * M);
  eq(a.w.elapsed('R', NOW + 8 * M), 3 * M, 'højre efter 3 min');
});

test('Stop pauser uden at gemme amningen', async () => {
  const a = await boot({});
  a.setNow(NOW); a.$('btnL').click();
  a.setNow(NOW + 4 * M); a.$('btnL').click();
  eq(a.state().active.running, null); eq(a.state().active.acc.L, 4 * M); eq(a.state().sessions.length, 0);
});

test('Gem logger amningen med start, slut og sekunder pr. side', async () => {
  const a = await boot({});
  a.setNow(NOW); a.$('btnL').click();
  a.setNow(NOW + 5 * M); a.$('btnR').click();
  a.setNow(NOW + 12 * M); a.$('saveBtn').click();
  const s = a.state();
  eq(s.active, null);
  eq(s.sessions.length, 1);
  const x = s.sessions[0];
  eq([x.start, x.end, x.L, x.R], [NOW, NOW + 12 * M, 300, 420]);
  eq(s.lastSide, 'R');
  eq(a.stored().sessions.length, 1, 'gemt i localStorage');
});

test('Gem med 0 sekunder logger ikke noget', async () => {
  const a = await boot({});
  a.setNow(NOW); a.$('btnL').click(); a.$('saveBtn').click();
  eq(a.state().sessions.length, 0); eq(a.state().active, null);
});

test('Annullér kasserer amningen', async () => {
  const a = await boot({});
  a.setNow(NOW); a.$('btnL').click();
  a.setNow(NOW + 3 * M); a.$('cancelBtn').click();
  eq(a.state().active, null); eq(a.state().sessions.length, 0);
});

test('Annullér gør intet, hvis man siger nej', async () => {
  const a = await boot({});
  a.setNow(NOW); a.$('btnL').click();
  a.confirmAnswer(false); a.$('cancelBtn').click();
  ok(a.state().active, 'amningen forsvandt');
});

test('Timeren tæller videre, når appen genåbnes (låst telefon)', async () => {
  const active = { start: NOW - 10 * M, acc: { L: 4 * M, R: 0 }, running: 'R', since: NOW - 6 * M };
  const a = await boot({ active });
  a.setNow(NOW);
  eq(a.w.elapsed('L'), 4 * M); eq(a.w.elapsed('R'), 6 * M);
  eq(a.text('btnR'), 'Stop højre');
});

// ---------- Siden sidste amning ----------
const SINCE = (t) => `Sidste amning sluttede for ${t} siden`;
async function sinceFor(sessions) {
  const a = await boot({ sessions });
  a.setNow(NOW); a.live();
  return a.text('since');
}
test('Siden sidste amning måles fra sluttid, ikke start', async () => {
  eq(await sinceFor([sess('a', 90 * M, 30 * M)]), SINCE('30m'));
});
test('Siden sidste amning viser timer og minutter', async () => {
  eq(await sinceFor([sess('a', 3 * H, 2 * H + 5 * M)]), SINCE('2t 5m'));
});
test('Siden sidste amning: seneste sluttid vinder ved overlap', async () => {
  eq(await sinceFor([sess('b', 100 * M, 90 * M), sess('a', 120 * M, 60 * M)]), SINCE('1t 0m'));
});
test('Siden sidste amning: sluttid i fremtiden giver 0m, ikke negativ', async () => {
  eq(await sinceFor([sess('a', 30 * M, -10 * M)]), SINCE('0m'));
});
test('Siden sidste amning: gammelt format uden end bruger start + L + R', async () => {
  eq(await sinceFor([sess('a', 60 * M, null, 600, 600)]), SINCE('40m'));
});
test('Siden sidste amning er tom uden amninger og under en amning', async () => {
  eq(await sinceFor([]), '');
  const a = await boot({ sessions: [sess('a', 90 * M, 30 * M)],
    active: { start: NOW - 5 * M, acc: { L: 0, R: 0 }, running: 'L', since: NOW - 5 * M } });
  a.setNow(NOW); a.live();
  eq(a.text('since'), '');
});

// ---------- Amning: redigering ----------
test('Redigering: gyldig sluttid gemmes', async () => {
  const a = await boot({ sessions: [sess('a', 90 * M, 30 * M)] });
  a.w.openEdit('a');
  a.w.eval('ed.apply = null; ed.end = Date.now() - 20 * 60000;');
  a.submit('editDlg');
  eq(Math.round((a.realNow() - a.state().sessions[0].end) / M), 20);
  eq(a.alerts.length, 0, 'antal beskeder');
});

  ok(a.alerts.some((m) => m.includes('fremtiden')), 'ingen besked om fremtiden');

  const a = await boot({ sessions: [sess('a', 90 * M, 30 * M)] });

// ---------- Statistik ----------
test('Statistik: gns. tid mellem og længste pause regnes fra slut til start', async () => {
  const a = await boot({ sessions: [sess('c', 2 * H, H + 45 * M), sess('b', 4 * H, 3 * H + 30 * M), sess('a', 6 * H, 5 * H + 30 * M)] });
  const st = a.w.computeStats(7);
  eq(st.n, 3); eq(st.avgGap, 90 * M, 'gns. tid mellem');
  if (new Date(NOW - 6 * H).toDateString() === new Date(NOW).toDateString()) eq(st.today.longest, 90 * M, 'længste pause');
});
test('Statistik: overlappende amninger giver pause 0, ikke negativ', async () => {
  const a = await boot({ sessions: [sess('b', 100 * M, 90 * M), sess('a', 120 * M, 60 * M)] });
  eq(a.w.computeStats(7).avgGap, 0);
});
test('Statistik: amninger ældre end perioden tæller ikke med', async () => {
  const a = await boot({ sessions: [sess('b', H, 50 * M), sess('a', 10 * 24 * H, 10 * 24 * H - 10 * M)] });
  eq(a.w.computeStats(7).n, 1);
  eq(a.w.computeStats(30).n, 2);
});

// ---------- Backup ----------

// ---------- Kørsel ----------
async function runAll() {
  const out = document.getElementById('out');
  const summary = document.getElementById('summary');
  if (!LOCAL) {
    summary.textContent = 'Testene kører kun på localhost, så de ikke rører rigtige data.';
    document.title = 'SKIPPED';
    return;
  }
  // Gem eksisterende data, så de kan lægges tilbage
  const backup = {};
  for (const k of KEYS) backup[k] = localStorage.getItem(k);
  const lines = [];
  let fails = 0;
  try {
    for (const t of tests) {
      try {
        await t.fn();
        lines.push(`<span class="pass">PASS</span>  ${t.name}`);
      } catch (e) {
        fails++;
        lines.push(`<span class="fail">FAIL</span>  ${t.name}\n      ${String(e && e.message || e).replace(/</g, '&lt;')}`);
      }
      out.innerHTML = lines.join('\n');
    }
  } finally {
    document.getElementById('frameBox').innerHTML = '';
    for (const k of KEYS) backup[k] === null ? localStorage.removeItem(k) : localStorage.setItem(k, backup[k]);
  }
  const res = fails ? `FAIL: ${fails} af ${tests.length} tests fejlede` : `PASS: alle ${tests.length} tests bestået`;
  summary.textContent = res;
  summary.className = fails ? 'fail' : 'pass';
  document.title = res;
}
runAll();
</script>
</body>
</html>
